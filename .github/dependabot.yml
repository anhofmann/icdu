# Keep the commit-SHA pins in .github/workflows current (the version tag rides along as a
# comment), and the Cargo dependencies: one pull request a month for everything that has a
# newer compatible version. Security fixes do not wait for it: Dependabot opens those on
# its own, and the Audit workflow turns red on the day an advisory appears.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
