name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    uses: ./.github/workflows/dist.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum icdu-* > sha256sums.txt
          cat sha256sums.txt

      - name: Smoke test linux-x86_64 on the runner
        run: |
          chmod +x dist/icdu-portable-linux-x86_64
          dist/icdu-portable-linux-x86_64 --version

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/icdu-* dist/sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "icdu $GITHUB_REF_NAME" \
            --generate-notes
