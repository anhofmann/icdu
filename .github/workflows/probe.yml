name: Probe
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 tools/probe/closed_terminal.py
        timeout-minutes: 2
