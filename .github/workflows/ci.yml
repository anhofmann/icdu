name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      # `--locked`: with the versions in Cargo.lock, which are the ones a release is built
      # with, and failing if the lock file is not up to date.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      # Once more as a release build: without the overflow checks of a debug build, and with
      # the optimiser, which is what users run.
      - name: Tests (release)
        run: cargo test --locked --release
      - name: Build (release)
        run: cargo build --locked --release

  # The workflows and the shell scripts themselves.
  lint:
    name: workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: shellcheck
        run: shellcheck install.sh tools/dist/*.sh tools/demo/record.sh

  # The release binaries, so that what a tag would build is built for every change.
  dist:
    uses: ./.github/workflows/dist.yml

  # The install script, on the two systems it is for: with the archive that was just built
  # standing in for a release, and against the latest release there is.
  install:
    name: install script (${{ matrix.os }})
    needs: dist
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-latest,  target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.target }}
          path: release
      - name: Install what was just built, twice
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          (cd release && shasum -a 256 icdu-*.tar.gz > sha256sums.txt)
          export ICDU_BASE_URL="file://$PWD/release" ICDU_INSTALL_DIR="$RUNNER_TEMP/bin"
          ICDU_VERSION="$version" sh install.sh | tee first.txt
          grep -q "^installed icdu $version to " first.txt
          ICDU_VERSION="v$version" sh install.sh | tee second.txt
          grep -q "^icdu $version was installed in .* already" second.txt
          test "$("$RUNNER_TEMP/bin/icdu" --version)" = "icdu $version"
      # The runner's GitHub CLI is logged in through the token, so the script checks the
      # attestation here: this is also the test that a published release can be verified.
      - name: Install the latest release, verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ICDU_INSTALL_DIR="$RUNNER_TEMP/latest" sh install.sh | tee latest.txt
          grep -q "^verified: built by the release workflow of " latest.txt
          "$RUNNER_TEMP/latest/icdu" --version
      - name: A GitHub CLI without the attestation command does not stop the install
        run: |
          mkdir "$RUNNER_TEMP/old-gh"
          cat > "$RUNNER_TEMP/old-gh/gh" <<'GH'
          #!/bin/sh
          # What gh 2.23 does (the one in Debian 12): it is logged in, and has no such command.
          [ "$1" = auth ] && exit 0
          echo "unknown command \"$1\" for \"gh\"" >&2
          exit 1
          GH
          chmod +x "$RUNNER_TEMP/old-gh/gh"
          PATH="$RUNNER_TEMP/old-gh:$PATH" ICDU_INSTALL_DIR="$RUNNER_TEMP/old" sh install.sh | tee old.txt
          grep -q "^not verified who built it" old.txt
          "$RUNNER_TEMP/old/icdu" --version

  # The Homebrew formula as the tap will carry it: written for the archives this run built,
  # put into a tap on the runner, installed from there, tested, and removed again.
  homebrew:
    name: Homebrew formula (${{ matrix.os }})
    needs: dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: release
      - name: Install from a tap, test, remove
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          (cd release && shasum -a 256 icdu-*.tar.gz > sha256sums.txt)
          brew tap-new --no-git local/icdu
          tools/dist/homebrew-formula.sh "$version" release/sha256sums.txt "file://$PWD/release" \
            > "$(brew --repository local/icdu)/Formula/icdu.rb"
          cat "$(brew --repository local/icdu)/Formula/icdu.rb"
          brew install local/icdu/icdu
          brew test local/icdu/icdu
          test "$(icdu --version)" = "icdu $version"
          test -f "$(brew --prefix)/share/man/man1/icdu.1"
          brew uninstall icdu
          test ! -e "$(brew --prefix)/bin/icdu"

  # The AUR package icdu-bin: its PKGBUILD written for the archive this run built, then, in
  # an Arch Linux container, built, checked with namcap, installed, used and removed.
  aur:
    name: AUR package
    needs: dist
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: What the job needs besides the build tools
        run: pacman -Syu --noconfirm --needed git namcap
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: release
      - name: Build, check, install, use, remove
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          (cd release && sha256sum icdu-*.tar.gz > sha256sums.txt)
          mkdir build
          tools/dist/aur-pkgbuild.sh "$version" release/sha256sums.txt "file://$PWD/release" > build/PKGBUILD
          cat build/PKGBUILD
          # makepkg does not run as root.
          useradd --create-home builder
          chown -R builder build
          cd build
          su builder -c 'makepkg --printsrcinfo > .SRCINFO && cat .SRCINFO && makepkg --noconfirm'
          # namcap reports and does not fail: an "E:" line is what fails here.
          namcap PKGBUILD icdu-bin-*.pkg.tar.zst | tee namcap.txt
          if grep -q ' E: ' namcap.txt; then
            exit 1
          fi
          pacman -U --noconfirm icdu-bin-*.pkg.tar.zst
          test "$(icdu --version)" = "icdu $version"
          # The container's pacman is set up not to unpack manual pages at all, so the page
          # is looked for in what the package says it contains.
          pacman -Qlq icdu-bin | grep -qx /usr/share/man/man1/icdu.1.gz
          test -f /usr/share/licenses/icdu-bin/LICENSE
          pacman -R --noconfirm icdu-bin
          test ! -e /usr/bin/icdu

  # The oldest Rust that icdu promises to build with: `rust-version` in Cargo.toml.
  msrv:
    name: minimum Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the declared minimum
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo "+$MSRV" test --locked
      - name: Build (release)
        run: cargo "+$MSRV" build --release --locked
