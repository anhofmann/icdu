[package]
name = "icdu"
version = "0.4.1"
edition = "2021"
# What the newest dependency needs (ratatui 0.30). CI builds and tests with exactly this
# version, taken from this line.
rust-version = "1.88"
description = "A disk usage explorer you can browse and search while it is still scanning; compatible with ncdu"
license = "MIT"
repository = "https://github.com/anhofmann/icdu"
readme = "README.md"
keywords = ["ncdu", "disk-usage", "du", "tui", "cli"]
categories = ["command-line-utilities", "filesystem"]
# The crate is the program and what its tests read. Not the notes for contributors, the
# install script, the workflows or the tools for the README's recording.
include = ["/src", "/fixtures", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]

# Where `cargo binstall icdu` finds the release archives, and the binary inside one.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
# Only what icdu draws with: the crossterm backend and the layout cache. The defaults
# also bring a macro crate, a calendar widget and with it a date library.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossbeam-channel = "0.5"
# The version ratatui uses, so that the build has one copy of it. (0.10 is out; ratatui 0.30
# is on 0.9.)
compact_str = "0.9"
# Already in the build as a dependency of crossterm (via ratatui): naming it adds no code.
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Also for `cargo install`: the release workflow strips its builds anyway.
strip = true
